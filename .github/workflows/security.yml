name: Security Checks

on:
  push:
    branches: [ development ]
  pull_request:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore dependency-check vulnerability database
        uses: actions/cache@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-v12-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-
      - name: Scan runtime dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./gradlew dependencyCheckAggregate

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-reports
          path: build/reports/
