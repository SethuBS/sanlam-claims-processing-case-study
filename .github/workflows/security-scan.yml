name: Security Scan

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore dependency-check vulnerability database
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-v12-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-

      - name: Scan runtime dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_DATA_DIR: ${{ runner.temp }}/dependency-check-data
        run: bash ./gradlew dependencyCheckAggregate --no-daemon

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-reports
          path: build/reports/
          if-no-files-found: warn
