version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      gradle-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
