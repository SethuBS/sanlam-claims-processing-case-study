plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.owasp.dependencycheck' version '12.2.2'
}

allprojects {
    group = 'com.sethu.claims'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    failOnError = true
    formats = ['HTML', 'SARIF']

    String configuredNvdApiKey = System.getenv('NVD_API_KEY')
    if (configuredNvdApiKey != null && !configuredNvdApiKey.isBlank()) {
        nvd.apiKey = configuredNvdApiKey
    } else {
        // OWASP's maintained feed avoids the severe anonymous NVD API rate limit
        // while still failing the build if vulnerability data cannot be refreshed.
        nvd.datafeedUrl = 'https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'
    }

    String configuredDataDirectory = System.getenv('DEPENDENCY_CHECK_DATA_DIR')
    if (configuredDataDirectory != null && !configuredDataDirectory.isBlank()) {
        data.directory = configuredDataDirectory
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    // Security patch levels newer than Spring Boot 3.5.16's baseline BOM.
    ext['jackson-bom.version'] = '2.21.6'
    ext['log4j2.version'] = '2.25.5'
    ext['postgresql.version'] = '42.7.13'
    ext['tomcat.version'] = '10.1.59'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.assertj:assertj-core'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
